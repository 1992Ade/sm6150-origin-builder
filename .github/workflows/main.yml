name: Build sweet kernel (Spiteful + OriginSU + SuSFS)

# Inspired by 1992Ade/msm8937-origin-builder and riarumoda/perf_neon-builder:
#   check -> build (susfs, manual) -> release
# Every Sunday the workflow looks for a new OriginSU release and rebuilds only
# when one is out (see UPDATE_POLICY below). A manual run always builds.

on:
  schedule:
    - cron: "23 4 * * 0"          # every Sunday, 04:23 UTC
  workflow_dispatch:
    inputs:
      originsu_ref:
        description: "OriginSU tag to build (empty = latest release)"
        required: false
        default: ""
      variants:
        description: "Variants to build"
        type: choice
        options: [both, susfs, manual]
        default: both
      toolchain:
        description: "'system' (Ubuntu clang 18) or the URL of a clang .tar.gz"
        required: false
        default: system
      publish:
        description: "Publish (or replace) the GitHub Release"
        type: boolean
        default: true

concurrency:
  group: kernel-build
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # When does the weekly run rebuild?
  #   major -> only when OriginSU's major version changes   (v4.x.x -> v5.0.0)
  #   minor -> on every major or minor release              (v4.3.x -> v4.4.0)
  #   all   -> on every new release, patch releases included (v4.3.0 -> v4.3.1)
  UPDATE_POLICY: all
  ORIGINSU_REPO: samakshkambxj/OriginSU
  NONGKI_REPO: JackA1ltman/NonGKI_Kernel_Build_2nd
  KERNEL_REPO: https://github.com/tbyool/android_kernel_xiaomi_sm6150
  KERNEL_BRANCH: "17.0"

jobs:
  # ------------------------------------------------------------------
  # 1) Is there something new to build?
  # ------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      build: ${{ steps.ver.outputs.build }}
      nongki_sha: ${{ steps.ver.outputs.nongki_sha }}
      matrix: ${{ steps.ver.outputs.matrix }}
    steps:
      - name: Compare the latest OriginSU release with our releases
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_REF: ${{ inputs.originsu_ref }}
          INPUT_VARIANTS: ${{ inputs.variants }}
        run: |
          set -euo pipefail
          TAG="${INPUT_REF:-}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$ORIGINSU_REPO" --json tagName -q .tagName 2>/dev/null || true)
          fi
          if [ -z "$TAG" ]; then
            TAG=$(gh api "repos/$ORIGINSU_REPO/tags" -q '.[0].name')
          fi
          [ -n "$TAG" ] || { echo "::error::Unable to find an OriginSU version"; exit 1; }
          echo "OriginSU: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Pin the SuSFS patch repository for the whole run (reproducible builds)
          NONGKI_SHA=$(gh api "repos/$NONGKI_REPO/commits/mainline" -q .sha)
          echo "SuSFS patches: $NONGKI_REPO @ $NONGKI_SHA"
          echo "nongki_sha=$NONGKI_SHA" >> "$GITHUB_OUTPUT"

          case "${INPUT_VARIANTS:-both}" in
            susfs)  echo 'matrix=["susfs"]' >> "$GITHUB_OUTPUT" ;;
            manual) echo 'matrix=["manual"]' >> "$GITHUB_OUTPUT" ;;
            *)      echo 'matrix=["susfs","manual"]' >> "$GITHUB_OUTPUT" ;;
          esac

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run -> build"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Last OriginSU version we released (release tags: originsu-<tag>)
          LAST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
                   --json tagName -q '.[].tagName' | sed -n 's/^originsu-//p' | sort -V | tail -n1)
          key() {
            local v="${1#v}" a b c
            IFS=. read -r a b c <<< "$v"
            case "$UPDATE_POLICY" in
              major) echo "${a:-0}" ;;
              minor) echo "${a:-0}.${b:-0}" ;;
              *)     echo "$v" ;;
            esac
          }
          if [ -z "$LAST" ]; then
            echo "No release yet -> build"
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$(printf '%s\n%s\n' "${LAST#v}" "${TAG#v}" | sort -V | tail -n1)" != "${TAG#v}" ] \
               || [ "$(key "$TAG")" = "$(key "$LAST")" ]; then
            echo "Last build: $LAST, latest: $TAG, policy: $UPDATE_POLICY -> nothing to do"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Last build: $LAST, latest: $TAG, policy: $UPDATE_POLICY -> build"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------
  # 2) Build both variants in parallel
  # ------------------------------------------------------------------
  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        hook_mode: ${{ fromJSON(needs.check.outputs.matrix) }}
    env:
      HOOK_MODE: ${{ matrix.hook_mode }}
      ORIGINSU_REF: ${{ needs.check.outputs.tag }}
      NONGKI_REF: ${{ needs.check.outputs.nongki_sha }}
      TOOLCHAIN: ${{ inputs.toolchain || 'system' }}
      KERNEL_DIR: ${{ github.workspace }}/kernel
      BUILD_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      BUILD_REPO_SHA: ${{ github.sha }}
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex cpio curl git zip unzip patch python3 \
            libssl-dev libelf-dev lz4 zstd \
            clang lld llvm \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Toolchain
        run: bash scripts/build.sh deps

      - name: Clone kernel source
        run: bash scripts/build.sh sync

      - name: Integrate OriginSU ${{ needs.check.outputs.tag }}
        run: bash scripts/build.sh originsu

      - name: Apply the SuSFS kernel patch
        if: matrix.hook_mode == 'susfs'
        run: bash scripts/build.sh susfs

      - name: Apply hooks (${{ matrix.hook_mode }})
        run: bash scripts/build.sh hooks

      - name: Configure
        run: bash scripts/build.sh config

      - name: Build kernel
        run: bash scripts/build.sh kernel

      - name: Pack AnyKernel3 zip
        id: zip
        run: bash scripts/build.sh zip

      - name: Upload build log (also on failure)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ matrix.hook_mode }}
          path: |
            build.log
            kernel/out/.config
          if-no-files-found: ignore

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: sweet-OriginSU-${{ matrix.hook_mode }}
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 3) Publish the GitHub Release (even if only one variant built)
  # ------------------------------------------------------------------
  release:
    needs: [check, build]
    if: >-
      !cancelled() && needs.check.outputs.build == 'true' &&
      (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ORIGINSU_TAG: ${{ needs.check.outputs.tag }}
      TAG: originsu-${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: sweet-OriginSU-*
          merge-multiple: true

      - name: Write release notes
        run: |
          set -euo pipefail
          ls dist/*.zip >/dev/null 2>&1 || { echo "::error::No zip was built"; exit 1; }
          SRC=$(ls dist/SOURCE-*.txt | sort | tail -n1)   # prefers SOURCE-susfs.txt
          field() { grep -m1 "^$1" "$SRC" | cut -d: -f2- | sed 's/^ *//'; }
          SUSFS=$(grep -m1 '^SuSFS' dist/SOURCE-susfs.txt 2>/dev/null | cut -d: -f2- | sed 's/^ *//' || true)
          {
            echo "## Redmi Note 10 Pro (sweet) — Spiteful + OriginSU \`$ORIGINSU_TAG\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| OriginSU | [$ORIGINSU_TAG](https://github.com/$ORIGINSU_REPO/releases/tag/$ORIGINSU_TAG) |"
            echo "| SuSFS | ${SUSFS:-not built} |"
            echo "| Kernel | \`$(field 'Kernel release')\` |"
            echo "| Kernel source | $(field 'Kernel source') |"
            echo "| Toolchain | $(field 'Toolchain') |"
            echo "| Build date | $(date -u +%Y-%m-%d) |"
            echo
            echo "### Which zip should I flash?"
            echo "- **\`-susfs-\`** — OriginSU (SuSFS inline hook) + SuSFS root hiding. **Recommended.**"
            echo "- **\`-manual-\`** — OriginSU manual hook, no SuSFS. Fallback if the SuSFS build does not boot."
            echo
            echo "KPM is disabled in both. Back up \`boot\` and \`dtbo\`, flash from recovery, then install the manager from the [OriginSU $ORIGINSU_TAG release](https://github.com/$ORIGINSU_REPO/releases/tag/$ORIGINSU_TAG)."
            echo
            echo "Exact source revisions: \`SOURCE-*.txt\` (also inside each zip)."
          } > notes.md
          cat notes.md

      - name: Create (or replace) the release
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "sweet — OriginSU $ORIGINSU_TAG" \
            --notes-file notes.md --latest \
            dist/*.zip dist/*.sha256 dist/SOURCE-*.txt dist/config-*.txt
