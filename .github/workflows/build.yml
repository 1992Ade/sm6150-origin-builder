name: Build sweet Kernel (Spiteful) with OriginSU

# Self-contained workflow (no extra scripts in this repository), same structure as
# 1992Ade/msm8937-origin-builder. Kernel: tbyool's Spiteful sm6150 4.14 (branch 17.0).
# Integration adapted from riarumoda/perf_neon-builder (sweet/crdroid), with BakaSU
# replaced by OriginSU and JackA1ltman's NonGKI SuSFS patch + hook scripts.

on:
  # Checks every Sunday (04:23 UTC) whether a new OriginSU release is out
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:
    inputs:
      originsu_ref:
        description: "OriginSU tag to build (empty = latest release)"
        required: false
        default: ""
      kpm:
        description: "Enable CONFIG_KPM"
        type: boolean
        default: false
      publish:
        description: "Publish a GitHub Release"
        type: boolean
        default: true

concurrency:
  group: kernel-build
  cancel-in-progress: false

permissions:
  contents: read

# bash -eo pipefail: a make error in "make | tee" fails the step
defaults:
  run:
    shell: bash

env:
  KERNEL_REPO: tbyool/android_kernel_xiaomi_sm6150
  KERNEL_BRANCH: "17.0"
  KERNEL_DIR: android_kernel_xiaomi_sm6150
  KERNEL_VERSION: "4.14"
  DEVICE: sweet
  KBUILD_BUILD_USER: builder
  KBUILD_BUILD_HOST: github-actions
  MAKE_ARGS: ARCH=arm64 LLVM=1 LLVM_IAS=1 LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

jobs:
  # ------------------------------------------------------------------
  # 1) Do we need to build? (new OriginSU version, with its manager APK)
  # ------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      build: ${{ steps.ver.outputs.build }}
      nongki_sha: ${{ steps.ver.outputs.nongki_sha }}
    steps:
      - name: Compare OriginSU latest release with our releases
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.originsu_ref }}"
          if [ -z "$TAG" ]; then
            # Latest stable release (gh skips pre-releases)
            TAG=$(gh release view --repo samakshkambxj/OriginSU --json tagName -q .tagName 2>/dev/null || true)
          fi
          [ -n "$TAG" ] || { echo "::error::Could not determine the OriginSU version"; exit 1; }
          echo "OriginSU version: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Pin JackA1ltman's SuSFS patches for the whole run (both variants use the same commit)
          NONGKI_SHA=$(gh api repos/JackA1ltman/NonGKI_Kernel_Build_2nd/commits/mainline -q .sha)
          echo "NonGKI patches: $NONGKI_SHA"
          echo "nongki_sha=$NONGKI_SHA" >> "$GITHUB_OUTPUT"

          # Only build when the matching manager is published in the release
          APKS=$(gh release view "$TAG" --repo samakshkambxj/OriginSU --json assets -q '.assets[].name' 2>/dev/null | grep -E '\.apk$' || true)
          if [ -z "$APKS" ]; then
            echo "::warning::OriginSU release $TAG does not contain the manager APK (yet) -> no build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run -> forced build"
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif gh release view "originsu-$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release originsu-$TAG already published -> nothing to do"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version detected -> build"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------
  # 2) Build (SUSFS inline hook + manual hook)
  # ------------------------------------------------------------------
  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest   # Neutron Clang needs a recent glibc (24.04)
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        hook_mode: [susfs, manual]
    env:
      ORIGINSU_TAG: ${{ needs.check.outputs.tag }}
      HOOK_MODE: ${{ matrix.hook_mode }}
      NONGKI: https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/${{ needs.check.outputs.nongki_sha }}/Patches
      # KPM is off by default: only enabled when ticked on a manual run
      # (scheduled runs have no inputs -> 'false')
      KPM: ${{ github.event_name == 'workflow_dispatch' && inputs.kpm || 'false' }}

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex zip curl git wget \
            libssl-dev libelf-dev zstd lld python3 python-is-python3 cpio unzip \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Clone kernel
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "https://github.com/${KERNEL_REPO}.git" "$KERNEL_DIR"
          echo "KERNEL_COMMIT=$(git -C "$KERNEL_DIR" rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Download Neutron Clang
        run: |
          TC_URL="$(curl -fsSL --retry 5 --retry-all-errors -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*"' | head -n1 | cut -d '"' -f4)"
          [ -n "$TC_URL" ] || { echo "Toolchain URL not found"; exit 1; }
          mkdir -p "$KERNEL_DIR/clang"
          curl -fL --retry 5 --retry-all-errors -o /tmp/clang.tar.zst "$TC_URL"
          tar --zstd -C "$KERNEL_DIR/clang" -xf /tmp/clang.tar.zst
          rm -f /tmp/clang.tar.zst
          echo "$PWD/$KERNEL_DIR/clang/bin" >> "$GITHUB_PATH"
          echo "TOOLCHAIN=$("$KERNEL_DIR/clang/bin/clang" --version | head -n1)" >> "$GITHUB_ENV"

      - name: Generate kernel config
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # sweet_defconfig is a full config in tbyool's tree (ThinLTO, KALLSYMS_ALL...)
          mkdir -p out
          make O=out $MAKE_ARGS "${DEVICE}_defconfig"
          { yes "" 2>/dev/null || true; } | make O=out $MAKE_ARGS olddefconfig

          cp out/.config "arch/arm64/configs/${DEVICE}_stock_defconfig"
          cp out/.config "arch/arm64/configs/${DEVICE}_origin_defconfig"
          rm -rf out
          echo "FINAL_DEFCONFIG=arch/arm64/configs/${DEVICE}_origin_defconfig" >> "$GITHUB_ENV"
          echo "COMPILE_DEFCONFIG=${DEVICE}_origin_defconfig" >> "$GITHUB_ENV"
          # /proc/config.gz shows the stock config (as in perf_neon)
          sed -i "s|\$(KCONFIG_CONFIG)|arch/arm64/configs/${DEVICE}_stock_defconfig|g" kernel/Makefile

      - name: Device patches (as in perf_neon sweet-crdroid)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          sed -i "s/printf '%s' -dirty/:/g" scripts/setlocalversion
          sed -i 's/CONFIG_IKHEADERS=y/# CONFIG_IKHEADERS is not set/g' "$FINAL_DEFCONFIG"
          sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-Spiteful-OriginSU"/' "$FINAL_DEFCONFIG"
          cat >> "$FINAL_DEFCONFIG" <<'EOF'
          # CONFIG_CC_WERROR is not set
          CONFIG_EROFS_FS=y
          CONFIG_EROFS_FS_XATTR=y
          CONFIG_EROFS_FS_POSIX_ACL=y
          CONFIG_EROFS_FS_SECURITY=y
          CONFIG_EROFS_FS_ZIP=y
          CONFIG_LTO_CLANG=y
          CONFIG_THINLTO=y
          CONFIG_MODULE_REL_CRCS=y
          CONFIG_SECURITY_SELINUX_DEVELOP=y
          CONFIG_DM_CRYPT=y
          CONFIG_DM_DEFAULT_KEY=y
          CONFIG_DM_SNAPSHOT=y
          CONFIG_DM_UEVENT=y
          CONFIG_DM_VERITY=y
          CONFIG_DM_VERITY_FEC=y
          CONFIG_DM_BOW=y
          EOF
          sed -i 's/^[[:space:]]*CONFIG_/CONFIG_/; s/^[[:space:]]*# CONFIG_/# CONFIG_/' "$FINAL_DEFCONFIG"

      - name: Integrate OriginSU (instead of BakaSU)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # 1) Set up OriginSU (clone into ./KernelSU + drivers/kernelsu symlink)
          curl -LSs --fail --retry 3 https://raw.githubusercontent.com/samakshkambxj/OriginSU/main/kernel/setup.sh \
            | bash -s "$ORIGINSU_TAG"
          [ -e drivers/kernelsu/Kconfig ] || { echo "::error::drivers/kernelsu missing after setup.sh"; exit 1; }

          # 1b) OriginSU non-GKI fix (older OriginSU versions): include preinit.h unconditionally
          F=KernelSU/kernel/runtime/ksud_integration.c
          if [ -f "$F" ] && grep -q 'ksu_preinit_release' "$F" && \
             ! sed -n '1,/^#if defined(CONFIG_KSU_TRACEPOINT_HOOK)/p' "$F" | grep -q '^#include "preinit/preinit.h"'; then
            sed -i '0,/^#if defined(CONFIG_KSU_TRACEPOINT_HOOK)/s//#include "preinit\/preinit.h" \/\/ fix non-GKI link\n&/' "$F"
            echo "-> preinit.h included unconditionally in $F"
          fi

          # 1c) 4.14 fix: pr_*_ratelimited()/DEFINE_RATELIMIT_STATE need <linux/ratelimit.h>,
          #     which printk.h does not include before 5.x kernels.
          #     Without it: "use of undeclared identifier '_rs'" (e.g. policy/su_request.c).
          grep -rlE '_ratelimited\(|DEFINE_RATELIMIT_STATE|__ratelimit\(' \
               --include='*.c' --include='*.h' KernelSU/kernel | while read -r f; do
            if ! grep -q 'linux/ratelimit.h' "$f"; then
              sed -i '1i #include <linux/ratelimit.h> /* fix 4.14 */' "$f"
              echo "-> linux/ratelimit.h added to $f"
            fi
          done

          # 2) Common configs
          cat >> "$FINAL_DEFCONFIG" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_MULTI_MANAGER_SUPPORT=y
          # CONFIG_KSU_DEBUG is not set
          CONFIG_HAVE_SYSCALL_TRACEPOINTS=y
          CONFIG_THREAD_INFO_IN_TASK=y
          EOF
          if [ "$KPM" = "true" ]; then
            echo "CONFIG_KPM=y" >> "$FINAL_DEFCONFIG"
          else
            echo "# CONFIG_KPM is not set" >> "$FINAL_DEFCONFIG"
          fi

          if [ "$HOOK_MODE" = "susfs" ]; then
            # 3a) SUSFS: kernel patch + SUSFS inline hooks
            curl -LSs --fail --retry 3 "$NONGKI/Patch/susfs_patch_to_${KERNEL_VERSION}.patch" | patch -p1 -s --fuzz=5 || true
            [ -f fs/susfs.c ] || { echo "::error::SuSFS patch did not apply (fs/susfs.c missing)"; exit 1; }
            cat >> "$FINAL_DEFCONFIG" <<'EOF'
          CONFIG_KSU_SUSFS=y
          # CONFIG_KSU_MANUAL_HOOK is not set
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF
            # 4.14 fix from perf_neon: uname spoof hook when the kernel/sys.c hunk is rejected
            if ! grep -q "susfs_is_uname_spoof_buffer_set" kernel/sys.c; then
              echo "-> patching kernel/sys.c for susfs_spoof_uname"
              git checkout kernel/sys.c
              rm -f kernel/sys.c.rej
              sed -i 's/^SYSCALL_DEFINE1(newuname/#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\nextern struct static_key_false susfs_is_uname_spoof_buffer_set;\nextern void susfs_spoof_uname(struct new_utsname* tmp);\n#endif\n&/' kernel/sys.c
              sed -i '/^SYSCALL_DEFINE1(newuname/,/^}/ s/memcpy(&tmp, utsname(), sizeof(tmp));/memcpy(\&tmp, utsname(), sizeof(tmp));\n#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n\tif (static_branch_likely(\&susfs_is_uname_spoof_buffer_set))\n\t\tsusfs_spoof_uname(\&tmp);\n#endif/' kernel/sys.c
            fi
            curl -LSs --fail --retry 3 "$NONGKI/susfs_inline_hook_patches.sh" -o /tmp/hooks.sh
          else
            # 3b) Manual hook. OriginSU hooks setuid, init.rc (sys_read) and input itself
            #     on 4.14 (LSM + input_handler, KSU_MANUAL_HOOK_AUTO_* = y): only patch the
            #     files OriginSU's manual_hook_check.mk asks for, otherwise the old-style
            #     read/input hooks of the script clash with OriginSU (ksu_vfs_read_hook...).
            cat >> "$FINAL_DEFCONFIG" <<'EOF'
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KSU_SUSFS is not set
          EOF
            curl -LSs --fail --retry 3 "$NONGKI/syscall_hook_patches.sh" -o /tmp/hooks.sh
            python3 - /tmp/hooks.sh <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          new = "patch_files=(\n    fs/exec.c\n    fs/open.c\n    fs/stat.c\n    kernel/reboot.c\n    security/selinux/ss/services.c\n)"
          s, n = re.subn(r"^patch_files=\(.*?^\)", new, s, count=1, flags=re.S | re.M)
          if n != 1:
              sys.exit("patch_files array not found in syscall_hook_patches.sh")
          open(p, "w").write(s)
          print("-> manual hooks limited to exec/open/stat/reboot (+ services.c)")
          PY
          fi
          sed -i 's/^[[:space:]]*CONFIG_/CONFIG_/; s/^[[:space:]]*# CONFIG_/# CONFIG_/' "$FINAL_DEFCONFIG"

          # 4) Hooks in the kernel sources
          bash /tmp/hooks.sh

          # 5) 4.14 fixes from perf_neon (SuSFS inline hooks)
          if [ "$HOOK_MODE" = "susfs" ]; then
            sed -i 's/ksu_handle_stat(&dfd, &fname, &flag);/ksu_handle_stat(\&dfd, \&fname, \&flags);/g' fs/stat.c
            if grep -q 'ksu_handle_faccessat(&dfd, &fname, &mode, NULL);' fs/open.c && \
               ! grep -q 'extern int ksu_handle_faccessat' fs/open.c; then
              echo "-> restoring fs/open.c declarations for faccessat"
              sed -i '/^long do_faccessat(/i\
          #ifdef CONFIG_KSU_SUSFS\
          extern struct static_key_true ksu_su_compat_enabled;\
          extern bool __ksu_is_allow_uid_for_current(uid_t uid);\
          extern int ksu_handle_faccessat(int *dfd, struct filename **filename, int *mode, int *flags);\
          extern int filename_lookup(int dfd, struct filename *name, unsigned flags, struct path *path, struct path *root);\
          #endif' fs/open.c
            fi
          fi

          # 6) Check the hooks OriginSU will look for at build time
          if [ "$HOOK_MODE" = "susfs" ]; then
            NEED="kernel/sys.c:ksu_handle_setresuid fs/exec.c:ksu_handle_execveat fs/open.c:ksu_handle_faccessat fs/read_write.c:ksu_handle_sys_read fs/stat.c:ksu_handle_stat kernel/reboot.c:ksu_handle_sys_reboot drivers/input/input.c:ksu_handle_input_handle_event"
          else
            NEED="fs/exec.c:ksu_handle_execveat fs/open.c:ksu_handle_faccessat fs/stat.c:ksu_handle_stat fs/stat.c:ksu_handle_newfstat_ret fs/stat.c:ksu_handle_fstat64_ret kernel/reboot.c:ksu_handle_sys_reboot"
          fi
          for p in $NEED; do
            grep -q "${p#*:}" "${p%%:*}" && echo "  hook ok: ${p#*:}" \
              || { echo "::error::hook ${p#*:} missing from ${p%%:*}"; exit 1; }
          done

          # 7) Export static SELinux symbols
          unstatic() { [ -f "$1" ] && grep -q "static $2" "$1" && sed -i "s/static $2/$2/" "$1" && echo "  exported: $2" || true; }
          unstatic security/selinux/selinuxfs.c   'ssize_t (\*write_op\[\])'
          unstatic security/selinux/selinuxfs.c   'ssize_t (\*const write_op\[\])'
          unstatic security/selinux/selinuxfs.c   'const struct file_operations sel_handle_status_ops'
          unstatic security/selinux/selinuxfs.c   'DEFINE_MUTEX(sel_mutex);'
          unstatic security/selinux/ss/status.c   'struct page \*selinux_status_page;'
          unstatic security/selinux/ss/status.c   'DEFINE_MUTEX(selinux_status_lock);'
          unstatic security/selinux/ss/services.c 'DEFINE_RWLOCK(policy_rwlock);'
          unstatic security/selinux/hooks.c       'struct security_operations selinux_ops'
          unstatic security/selinux/ss/services.c 'void security_dump_masked_av'
          unstatic security/selinux/ss/services.c 'void context_struct_compute_av'

          sed -i 's/\$(KSU_COMMIT_SHA)-dirty/$(KSU_COMMIT_SHA)/' KernelSU/kernel/Kbuild 2>/dev/null || true

      - name: Compile the kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          mkdir -p out
          make O=out $MAKE_ARGS "$COMPILE_DEFCONFIG"
          { yes "" 2>/dev/null || true; } | make O=out $MAKE_ARGS olddefconfig
          echo "--- Effective OriginSU configs ---"
          grep -E '^(# )?CONFIG_(KSU|KPM)' out/.config || true
          if [ "$HOOK_MODE" = "susfs" ]; then
            grep -q '^CONFIG_KSU_SUSFS=y' out/.config || { echo "::error::CONFIG_KSU_SUSFS is not enabled"; exit 1; }
          else
            grep -q '^CONFIG_KSU_MANUAL_HOOK=y' out/.config || { echo "::error::CONFIG_KSU_MANUAL_HOOK is not enabled"; exit 1; }
          fi
          set +e
          make -j"$(nproc --all)" O=out $MAKE_ARGS 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          set -e

          echo "--- OriginSU messages ---"
          grep -E -- '-- (OriginSU|KernelSU|KPM|SUSFS|You )' build.log | sort -u || true
          echo "--- Contents of out/arch/arm64/boot ---"
          ls -la out/arch/arm64/boot/ 2>/dev/null || echo "(directory missing)"

          if [ "$RC" -ne 0 ]; then
            echo "::error::Build failed (make exit code $RC). First errors:"
            grep -nE "error:|Error [0-9]|undefined reference|\*\*\*" build.log | head -n 40 || true
            exit "$RC"
          fi
          [ -f out/arch/arm64/boot/Image.gz ] || { echo "::error::Build succeeded but no Image.gz was produced."; exit 1; }

      - name: Upload build log (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.hook_mode }}
          path: |
            ${{ env.KERNEL_DIR }}/build.log
            ${{ env.KERNEL_DIR }}/out/.config
          if-no-files-found: ignore

      - name: Package with AnyKernel3
        run: |
          # riarumoda's AnyKernel3 is made for sweet/sweetin (boot + dtb + dtbo)
          git clone --depth=1 https://github.com/riarumoda/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/.github
          BOOT="$KERNEL_DIR/out/arch/arm64/boot"
          cp "$BOOT/Image.gz" AnyKernel3/
          for f in dtb.img dtbo.img; do
            if [ -f "$BOOT/$f" ]; then cp "$BOOT/$f" AnyKernel3/; else echo "::warning::$f not built, not included in the zip"; fi
          done
          sed -i 's/supported.versions=11-16/supported.versions=13-17/' AnyKernel3/anykernel.sh
          sed -i 's/KERNEL_BUILD_TYPE="Weekly"/KERNEL_BUILD_TYPE="OriginSU '"${ORIGINSU_TAG}"' ('"${HOOK_MODE}"')"/' AnyKernel3/anykernel.sh
          sed -i 's/sweet (sm6150)/sweet (SM6150) Spiteful + OriginSU/g' AnyKernel3/banner 2>/dev/null || true
          ZIP="Spiteful-OriginSU-${ORIGINSU_TAG}-${HOOK_MODE}-sweet-$(date +%Y%m%d).zip"
          (cd AnyKernel3 && zip -rq9 "../$ZIP" ./*)
          mkdir -p dist
          mv "$ZIP" dist/
          (cd dist && sha256sum "$ZIP" > "$ZIP.sha256")
          cp "$KERNEL_DIR/out/.config" "dist/config-${HOOK_MODE}.txt"
          cp "$KERNEL_DIR/build.log"   "dist/build-${HOOK_MODE}.log"
          {
            echo "KERNEL_COMMIT=$KERNEL_COMMIT"
            echo "KERNEL_RELEASE=$(cat "$KERNEL_DIR/out/include/config/kernel.release" 2>/dev/null)"
            echo "SUSFS_VERSION=$(grep -m1 '#define SUSFS_VERSION' "$KERNEL_DIR/include/linux/susfs.h" 2>/dev/null | cut -d'"' -f2)"
            echo "TOOLCHAIN=\"$TOOLCHAIN\""
          } > "dist/info-${HOOK_MODE}.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sweet-OriginSU-${{ matrix.hook_mode }}
          path: dist/*

  # ------------------------------------------------------------------
  # 3) Publish the GitHub Release
  # ------------------------------------------------------------------
  release:
    needs: [check, build]
    # Publishes even if only one of the two variants built
    if: >-
      !cancelled() && needs.check.outputs.build == 'true' &&
      (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: originsu-${{ needs.check.outputs.tag }}
      ORIGINSU_TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: sweet-OriginSU-*
          merge-multiple: true

      - name: Write release notes
        run: |
          ls dist/*.zip >/dev/null 2>&1 || { echo "::error::No zip was built"; exit 1; }
          source dist/info-susfs.txt 2>/dev/null || source dist/info-manual.txt
          [ -f dist/info-susfs.txt ] && SUSFS=$(grep '^SUSFS_VERSION=' dist/info-susfs.txt | cut -d= -f2) || SUSFS="not built"
          cat > notes.md <<EOF
          ## Redmi Note 10 Pro (sweet) — Spiteful + OriginSU \`${ORIGINSU_TAG}\`

          | | |
          |---|---|
          | OriginSU | [${ORIGINSU_TAG}](https://github.com/samakshkambxj/OriginSU/releases/tag/${ORIGINSU_TAG}) (kernel + manager) |
          | SuSFS | \`${SUSFS:-unknown}\` (susfs variant) |
          | Kernel | tbyool Spiteful \`${KERNEL_BRANCH}\` @ [\`${KERNEL_COMMIT}\`](https://github.com/${KERNEL_REPO}/commit/${KERNEL_COMMIT}) |
          | Kernel version | \`${KERNEL_RELEASE}\` |
          | Toolchain | ${TOOLCHAIN} |
          | Build date | $(date -u +%Y-%m-%d) |

          ### Which zip should I flash?
          - **\`-susfs-\`** — SuSFS inline hook: root + SuSFS hiding (recommended).
          - **\`-manual-\`** — Manual hook only, no SuSFS: try this if the SuSFS build does not boot.

          Back up your \`boot\` and \`dtbo\` partitions first, flash from recovery, then install the
          OriginSU manager from the [OriginSU release page](https://github.com/samakshkambxj/OriginSU/releases/tag/${ORIGINSU_TAG}).
          EOF
          sed -i 's/^          //' notes.md

      - name: Create (or replace) the release
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "sweet Spiteful OriginSU ${ORIGINSU_TAG}" \
            --notes-file notes.md --latest \
            dist/*.zip dist/*.sha256 dist/config-*.txt
